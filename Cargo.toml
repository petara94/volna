[package]
name = "volna"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Интерактивная двумерная электромагнитная лаборатория"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:egui_plot"]

[dependencies]
eframe = { version = "=0.36.2", optional = true, default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland", "accesskit"] }
egui_plot = { version = "=0.37.0", optional = true }
evalexpr = { version = "=11.3.1", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
sha2 = "=0.11.0"

[[bin]]
name = "volna"
path = "src/main.rs"
required-features = ["gui"]

[profile.release]
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"
